name: Радар заказов

on:
  schedule:
    - cron: "*/5 * * * *"    # каждые 5 минут (GitHub иногда запускает с опозданием)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write             # чтобы сохранять orders.json и seen.json

concurrency:
  group: orders-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить telethon (для чтения чатов)
        run: python -m pip install --quiet --disable-pip-version-check telethon

      - name: Проверить заказы
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}

      - name: Сохранить ленту
        run: |
          git config user.name "zakaz-radar"
          git config user.email "zakaz-radar@users.noreply.github.com"
          git add seen.json orders.json
          git diff --cached --quiet || (git commit -m "orders [skip ci]" && git pull --rebase && git push)
